
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>DOCTOR SEVA - Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>DOCTOR SEVA</h1>
  <p>Admin Dashboard</p>
</header>

<main class="container">

  <section class="card" id="adminLogin">
    <h2>Admin Login</h2>

    <form id="adminLoginForm">
      <label for="adminEmail">ઈમેલ</label>
      <input type="email" id="adminEmail" required>

      <label for="adminPassword">પાસવર્ડ</label>
      <input type="password" id="adminPassword" required>

      <button type="submit">Admin Login</button>
    </form>

    <p id="adminLoginMessage" role="status"></p>
  </section>

  <section class="card hidden" id="adminDashboard">

    <h2>Admin Dashboard</h2>

    <p id="adminWelcome">નમસ્તે Admin</p>

    <div class="status">
      DOCTOR SEVA Admin Panel
    </div>

    <h3>ડૉક્ટરોનું નિયંત્રણ</h3>

    <div id="doctorsAdminList">
      ડૉક્ટરો લોડ થઈ રહ્યા છે...
    </div>

    <hr>

    <h3>દર્દીઓની નોંધણી</h3>

    <div id="allPatients">
      દર્દીઓ લોડ થઈ રહ્યા છે...
    </div>

    <button type="button" id="adminLogout">
      Admin Logout
    </button>

  </section>

</main>

<footer>
  © DOCTOR SEVA
  <p>આ એપ તબીબી ઇમરજન્સી સેવા નથી.</p>
</footer>

<script type="module" src="admin.js"></script>

</body>
</html>

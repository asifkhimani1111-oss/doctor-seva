
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e46">
<title>DOCTOR SEVA - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f4;
 color:#172b25;
}
header{
 background:#075e46;
 color:white;
 padding:18px;
 text-align:center;
}
header h2{margin:0}
.container{
 max-width:950px;
 margin:20px auto;
 padding:12px;
}
.card{
 background:white;
 padding:18px;
 border-radius:14px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #00000012;
}
input{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:8px;
 margin:7px 0 12px;
 font-size:16px;
}
button{
 border:0;
 padding:11px 15px;
 border-radius:8px;
 color:white;
 background:#075e46;
 margin:4px;
 font-size:14px;
 cursor:pointer;
}
button:disabled{
 opacity:.6;
 cursor:not-allowed;
}
.red{background:#c62828}
.orange{background:#e58b00}
.blue{background:#1769aa}
.gray{background:#555}
.green{background:#16834c}
.approved{
 background:#16834c;
 cursor:default;
}
.clinic-on{
 background:#16834c;
}
.clinic-off{
 background:#c62828;
}
.small{
 font-size:13px;
 color:#66736e;
 word-break:break-all;
}
.status{
 padding:5px 9px;
 border-radius:20px;
 background:#e7f4ed;
 display:inline-block;
 font-size:13px;
}
.status.pending{
 background:#fff2d8;
 color:#8a5700;
}
.status.approved-status{
 background:#e1f5e8;
 color:#126b35;
}
.status.rejected-status{
 background:#ffebee;
 color:#b71c1c;
}
.hidden{display:none}
img{
 width:90px;
 height:90px;
 object-fit:cover;
 border-radius:10px;
}
#message{
 display:none;
 padding:13px;
 border-radius:9px;
 margin:12px 0;
 white-space:pre-wrap;
 font-weight:bold;
 background:#e5f6eb;
 color:#126b35;
 border:1px solid #a8dfb8;
}
#message.error{
 background:#ffebee;
 color:#b71c1c;
 border-color:#ef9a9a;
}
#loginMessage{
 color:#c62828;
 margin-top:8px;
}
.action-row{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:12px;
}
.doctor-card h3{
 color:#075e46;
 margin-top:12px;
}
</style>
</head>

<body>

<header>
  <h2>DOCTOR SEVA</h2>
  <p>Admin Control Panel</p>
</header>

<div class="container">

  <div id="loginBox" class="card">
    <h3>Admin Login</h3>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin Email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button id="loginButton">Login</button>

    <div id="loginMessage"></div>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h3>Admin Dashboard</h3>

      <p id="adminEmail"></p>

      <button class="red" id="logoutButton">Logout</button>
      <button class="blue" id="refreshButton">Refresh</button>

      <div id="message" role="status" aria-live="polite"></div>
    </div>

    <div class="card">
      <h3>ડૉક્ટરોની યાદી</h3>
      <div id="doctorList">Loading...</div>
    </div>

  </div>
</div>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 doc,
 getDocs,
 getDoc,
 setDoc,
 updateDoc,
 deleteDoc,
 Timestamp,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const ADMIN_UID="T6HtvOLrm5VYXHUuzuU5FZRZxGf2";

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const doctorList=document.getElementById("doctorList");
const messageBox=document.getElementById("message");
const loginMessage=document.getElementById("loginMessage");

let loadingDoctors=false;

function msg(text,error=false){

 messageBox.textContent=
  (error ? "✖ " : "✓ થઈ ગયું! ") + text;

 messageBox.className=error ? "error" : "";
 messageBox.style.display="block";

}

function clearMsg(){

 messageBox.textContent="";
 messageBox.style.display="none";
 messageBox.className="";

}

function escapeHTML(value){

 return String(value??"").replace(/[&<>"']/g,ch=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[ch]);

}

// LOGIN

async function login(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 loginMessage.textContent="";

 if(!email||!password){
  loginMessage.textContent="Email અને Password લખો.";
  return;
 }

 try{

  const result=await signInWithEmailAndPassword(
   auth,email,password
  );

  if(result.user.uid!==ADMIN_UID){

   await signOut(auth);

   loginMessage.textContent="આ એકાઉન્ટ Admin નથી.";

  }

 }catch(error){

  loginMessage.textContent="Login Error: "+error.message;

 }

}

document.getElementById("loginButton").addEventListener(
 "click",login
);

// AUTH CHECK

onAuthStateChanged(auth,async user=>{

 if(user&&user.uid===ADMIN_UID){

  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");

  document.getElementById("adminEmail").textContent=
   "Admin: "+user.email;

  await loadDoctors();

 }else{

  loginBox.classList.remove("hidden");
  dashboard.classList.add("hidden");

 }

});

// LOGOUT

async function logout(){

 try{

  await signOut(auth);

 }catch(error){

  msg("Logout Error: "+error.message,true);

 }

}

document.getElementById("logoutButton").addEventListener(
 "click",logout
);

document.getElementById("refreshButton").addEventListener(
 "click",loadDoctors
);

// DOCTOR LIST

async function loadDoctors(){

 if(loadingDoctors)return;

 loadingDoctors=true;
 doctorList.innerHTML="Loading...";

 try{

  const snapshot=await getDocs(
   collection(db,"doctorProfiles")
  );

  if(snapshot.empty){

   doctorList.innerHTML=
    "હજુ કોઈ Doctor Registration નથી.";

   return;

  }

  doctorList.innerHTML="";

  snapshot.forEach(item=>{

   const d=item.data();
   const uid=item.id;

   const approved=d.adminActive===true;
   const open=d.isOpen===true;

   const expiry=d.expiresAt?.toDate
    ?d.expiresAt.toDate().toLocaleDateString("en-IN")
    :"હજી સેટ નથી";

   const photo=d.doctorPhoto||"";

   const approvalText=approved
    ?"Approved"
    :(d.status||"Pending");

   const approvalClass=approved
    ?"approved-status"
    :(d.status==="rejected"
      ?"rejected-status"
      :"pending");

   const card=document.createElement("div");

   card.className="card doctor-card";

   card.innerHTML=`

    ${photo
     ?`<img src="${escapeHTML(photo)}" alt="Doctor Photo">`
     :""}

    <h3>
     Dr. ${escapeHTML((d.name||"")+" "+(d.surname||""))}
    </h3>

    <p>
     <b>Clinic:</b>
     ${escapeHTML(d.clinicName||"-")}
    </p>

    <p>
     <b>Degree:</b>
     ${escapeHTML(d.degree||"-")}
    </p>

    <p>
     <b>Mobile:</b>
     ${escapeHTML(d.phone||"-")}
    </p>

    <p>
     <b>WhatsApp:</b>
     ${escapeHTML(d.whatsapp||"-")}
    </p>

    <p>
     <b>Address:</b>
     ${escapeHTML(d.address||"-")}
    </p>

    <p>
     <b>Area:</b>
     ${escapeHTML(d.area||"-")}
    </p>

    <p>
     <b>Email:</b>
     ${escapeHTML(d.email||"-")}
    </p>

    <p>
     <b>Doctor UID:</b>
     <span class="small">${escapeHTML(uid)}</span>
    </p>

    <p>
     <b>Approval:</b>
     <span class="status ${approvalClass}">
      ${escapeHTML(approvalText)}
     </span>
    </p>

    <p>
     <b>Clinic Status:</b>
     <span class="status ${open?"approved-status":"rejected-status"}">
      ${open?"✓ Clinic ON":"Clinic OFF"}
     </span>
    </p>

    <p>
     <b>Expiry:</b>
     ${escapeHTML(expiry)}
    </p>

    <div class="action-row">

     <button
      class="${approved?"approved":"green"}"
      data-action="approve"
      ${approved?"disabled":""}>
      ${approved?"✓ Approved OK":"Approve + 30 Days"}
     </button>

     <button
      class="${open?"clinic-on":"clinic-off"}"
      data-action="toggle">
      ${open?"✓ Clinic ON":"Clinic OFF"}
     </button>

     <button class="red" data-action="reject">
      Reject
     </button>

     <button class="gray" data-action="remove">
      Remove Public Listing
     </button>

    </div>
   `;

   card.querySelector('[data-action="approve"]').onclick=
    ()=>approveDoctor(uid);

   card.querySelector('[data-action="toggle"]').onclick=
    ()=>toggleClinic(uid,!open);

   card.querySelector('[data-action="reject"]').onclick=
    ()=>rejectDoctor(uid);

   card.querySelector('[data-action="remove"]').onclick=
    ()=>removePublicListing(uid);

   doctorList.appendChild(card);

  });

 }catch(error){

  doctorList.innerHTML=
   "Error: "+escapeHTML(error.message);

  msg("Doctor List લોડ થઈ શકી નથી: "+error.message,true);

 }finally{

  loadingDoctors=false;

 }

}

// APPROVE DOCTOR

async function approveDoctor(uid){

 if(!confirm("આ Doctor ને 30 દિવસ માટે Approve કરવો છે?")){
  return;
 }

 try{

  const ref=doc(db,"doctorProfiles",uid);
  const snap=await getDoc(ref);

  if(!snap.exists()){
   msg("Doctor Profile મળ્યું નથી.",true);
   return;
  }

  const data=snap.data();

  const expiryDate=new Date();
  expiryDate.setDate(expiryDate.getDate()+30);

  const expiry=Timestamp.fromDate(expiryDate);

  const publicData={

   ...data,

   adminActive:true,
   status:"approved",
   isOpen:true,
   expiresAt:expiry,
   updatedAt:serverTimestamp()

  };

  await updateDoc(ref,{

   adminActive:true,
   status:"approved",
   isOpen:true,
   expiresAt:expiry,
   updatedAt:serverTimestamp()

  });

  await setDoc(
   doc(db,"publicDoctors",uid),
   publicData
  );

  await loadDoctors();

  msg(
   "Doctor Approved. 30 દિવસ માટે Clinic ON થઈ ગઈ."
  );

 }catch(error){

  msg("Approve Error: "+error.message,true);

 }

}

// CLINIC ON / OFF

async function toggleClinic(uid,newValue){

 try{

  const ref=doc(db,"doctorProfiles",uid);
  const snap=await getDoc(ref);

  if(!snap.exists()){
   msg("Doctor Profile મળ્યું નથી.",true);
   return;
  }

  const data=snap.data();

  if(newValue&&data.adminActive!==true){

   msg("પહેલાં Doctor ને Approve કરો.",true);
   return;

  }

  if(newValue){

   if(!data.expiresAt?.toDate ||
      data.expiresAt.toDate()<=new Date()){

    msg("Doctor ની મંજૂરીની મુદત પૂરી થઈ ગઈ છે.",true);
    return;

   }

  }

  await updateDoc(ref,{

   isOpen:newValue,
   updatedAt:serverTimestamp()

  });

  const publicRef=doc(db,"publicDoctors",uid);
  const publicSnap=await getDoc(publicRef);

  if(publicSnap.exists()){

   await updateDoc(publicRef,{

    isOpen:newValue,
    updatedAt:serverTimestamp()

   });

  }

  await loadDoctors();

  msg(
   newValue
    ?"Clinic ON થઈ ગઈ."
    :"Clinic OFF થઈ ગઈ."
  );

 }catch(error){

  msg("Clinic Status Error: "+error.message,true);

 }

}

// REJECT DOCTOR

async function rejectDoctor(uid){

 if(!confirm("આ Doctor ને Reject કરવો છે?")){
  return;
 }

 try{

  await updateDoc(
   doc(db,"doctorProfiles",uid),
   {
    adminActive:false,
    status:"rejected",
    isOpen:false,
    updatedAt:serverTimestamp()
   }
  );

  const publicRef=doc(db,"publicDoctors",uid);
  const publicSnap=await getDoc(publicRef);

  if(publicSnap.exists()){

   await deleteDoc(publicRef);

  }

  await loadDoctors();

  msg("Doctor Reject થઈ ગયા.");

 }catch(error){

  msg("Reject Error: "+error.message,true);

 }

}

// REMOVE PUBLIC LISTING

async function removePublicListing(uid){

 if(!confirm("આ Clinic ને Patient App માંથી દૂર કરવી છે?")){
  return;
 }

 try{

  const ref=doc(db,"publicDoctors",uid);
  const snap=await getDoc(ref);

  if(snap.exists()){

   await deleteDoc(ref);

  }

  await loadDoctors();

  msg("Public Listing દૂર થઈ ગઈ.");

 }catch(error){

  msg("Remove Error: "+error.message,true);

 }

}

</script>

</body>
</html>

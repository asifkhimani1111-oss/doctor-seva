
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>DOCTOR SEVA - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#18352a}
header{background:#087443;color:white;text-align:center;padding:22px 12px}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0;font-size:14px}
main{max-width:750px;margin:20px auto;padding:0 13px}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:17px;box-shadow:0 3px 13px #0000000d}
h2{font-size:20px;color:#087443;margin:0 0 15px}
input{width:100%;padding:13px;border:1px solid #ccd9d1;border-radius:9px;font-size:16px;margin:7px 0}
button{border:0;border-radius:9px;padding:12px 15px;font-size:14px;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#087443;color:white}
.secondary{background:#e8f2ec;color:#087443}
.danger{background:#ffeded;color:#b3261e}
.doctor{border:1px solid #dce9e1;border-radius:12px;padding:14px;margin:12px 0}
.doctor h3{color:#087443;margin:0 0 9px}
.doctor p{font-size:14px;margin:7px 0;overflow-wrap:anywhere}
.photo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #dce9e1;margin:8px 0}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;background:#fff5d9;color:#775600}
.approved{background:#e2f5e9;color:#087443}
.rejected{background:#ffeded;color:#b3261e}
#message,#loginMessage{display:none;padding:12px;border-radius:9px;margin-top:12px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.success{display:block!important;background:#e2f5e9;color:#087443}
.error{display:block!important;background:#ffeded;color:#b3261e}
.hidden{display:none!important}
.hint{font-size:12px;color:#68766e;line-height:1.5}
footer{text-align:center;padding:20px;color:#718078;font-size:12px}
</style>
</head>

<body>

<header>
<h1>DOCTOR SEVA</h1>
<p>Admin Dashboard</p>
</header>

<main>

<section class="card" id="loginSection">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Admin Email" autocomplete="username">
<input type="password" id="password" placeholder="Admin Password" autocomplete="current-password">
<button class="primary" id="loginBtn">Login કરો</button>
<div id="loginMessage"></div>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<h2>Admin Dashboard</h2>
<p id="adminInfo" class="hint"></p>
<button class="secondary" id="refreshBtn">માહિતી Refresh કરો</button>
<button class="danger" id="logoutBtn">Logout</button>
<div id="message"></div>
</div>

<div class="card">
<h2>ડૉક્ટરોની યાદી</h2>
<div id="doctorList">
<p class="hint">ડૉક્ટરોની માહિતી લોડ થઈ રહી છે...</p>
</div>
</div>

</section>
</main>

<footer>© DOCTOR SEVA Admin</footer>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 onSnapshot,
 doc,
 getDocs,
 writeBatch
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const ADMIN_UID = "T6HtvOLrm5VYXHUuzuU5FZRZxGf2";

const loginSection=document.getElementById("loginSection");
const dashboard=document.getElementById("dashboard");
const doctorList=document.getElementById("doctorList");
const messageBox=document.getElementById("message");
const loginMessage=document.getElementById("loginMessage");
const loginBtn=document.getElementById("loginBtn");

let profileDoctors=[];
let publicDoctors={};
let unsubscribeProfiles=null;
let unsubscribePublic=null;

function showMessage(text,type="success"){
 messageBox.textContent=text;
 messageBox.className=type;
}

function showLoginMessage(text,type="error"){
 loginMessage.textContent=text;
 loginMessage.className=type;
}

function element(tag,text,className){
 const el=document.createElement(tag);
 el.textContent=text;
 if(className)el.className=className;
 return el;
}

function addButton(parent,text,className,callback){
 const btn=document.createElement("button");
 btn.textContent=text;
 btn.className=className;
 btn.addEventListener("click",callback);
 parent.appendChild(btn);
}

function statusLabel(status){
 if(status==="approved"){
  return element("span","મંજૂર","status approved");
 }
 if(status==="rejected"){
  return element("span","Reject થયેલ","status rejected");
 }
 return element("span","મંજૂરી બાકી","status");
}

function renderDoctors(){

 doctorList.replaceChildren();

 if(profileDoctors.length===0){
  doctorList.appendChild(
   element("p","હાલમાં કોઈ ડૉક્ટર Registration નથી.","hint")
  );
  return;
 }

 profileDoctors.forEach((doctor)=>{

  const publicData=publicDoctors[doctor.id]||{};

  const adminActive=publicData.adminActive===true;
  const clinicOpen=publicData.isOpen===true;

  const card=document.createElement("div");
  card.className="doctor";

  if(doctor.photoBase64){
   const photo=document.createElement("img");
   photo.className="photo";
   photo.src=doctor.photoBase64;
   photo.alt="ડૉક્ટરનો ફોટો";
   card.appendChild(photo);
  }

  const fullName=(doctor.name||"")+" "+(doctor.surname||"");

  card.appendChild(
   element("h3",fullName.trim()||"નામ આપ્યું નથી")
  );

  card.appendChild(statusLabel(doctor.status));
  card.appendChild(element("p","ક્લિનિક: "+(doctor.clinicName||"માહિતી નથી")));
  card.appendChild(element("p","ગામ: "+(doctor.area||"માહિતી નથી")));
  card.appendChild(element("p","મોબાઇલ: "+(doctor.phone||"માહિતી નથી")));
  card.appendChild(element("p","Email: "+(doctor.email||"માહિતી નથી")));
  card.appendChild(element("p","સૂચનાઓ: "+(doctor.instructions||"કોઈ સૂચના નથી")));

  if(doctor.status==="approved"){

   card.appendChild(element(
    "p",
    adminActive?"Admin સ્થિતિ: ON":"Admin સ્થિતિ: OFF",
    "hint"
   ));

   card.appendChild(element(
    "p",
    clinicOpen?"Clinic સ્થિતિ: OPEN":"Clinic સ્થિતિ: CLOSED",
    "hint"
   ));
  }

  if(doctor.status!=="approved"){
   addButton(card,"Approve કરો","primary",()=>approveDoctor(doctor));
  }

  if(doctor.status!=="rejected"){
   addButton(card,"Reject કરો","danger",()=>rejectDoctor(doctor));
  }

  if(doctor.status==="approved"){
   addButton(
    card,
    adminActive?"Admin OFF કરો":"Admin ON કરો",
    "secondary",
    ()=>toggleDoctor(doctor,adminActive)
   );
  }

  doctorList.appendChild(card);
 });
}

async function loadDoctors(){

 const [profileSnap,publicSnap]=await Promise.all([
  getDocs(collection(db,"doctorProfiles")),
  getDocs(collection(db,"publicDoctors"))
 ]);

 profileDoctors=profileSnap.docs.map(item=>({
  id:item.id,
  ...item.data()
 }));

 publicDoctors={};

 publicSnap.docs.forEach(item=>{
  publicDoctors[item.id]=item.data();
 });

 renderDoctors();
}

async function approveDoctor(doctor){

 if(!confirm("આ ડૉક્ટરને મંજૂરી આપવી છે?"))return;

 try{

  if(!doctor.name||!doctor.surname||
     !doctor.clinicName||!doctor.area||!doctor.phone){
   showMessage("ડૉક્ટરની જરૂરી માહિતી અધૂરી છે.","error");
   return;
  }

  const batch=writeBatch(db);

  batch.update(doc(db,"doctorProfiles",doctor.id),{
   status:"approved",
   isOpen:false
  });

  batch.set(doc(db,"publicDoctors",doctor.id),{
   name:doctor.name,
   surname:doctor.surname,
   clinicName:doctor.clinicName,
   area:doctor.area,
   phone:doctor.phone,
   instructions:doctor.instructions||"",
   photoBase64:doctor.photoBase64||"",
   isOpen:false,
   adminActive:false
  });

  await batch.commit();

  await loadDoctors();

  showMessage("ડૉક્ટરને મંજૂરી મળી. હવે Admin ON કરી શકશે.");

 }catch(error){
  console.error(error);
  showMessage("મંજૂરી Error: "+error.code+" — "+error.message,"error");
 }
}

async function rejectDoctor(doctor){

 if(!confirm("આ ડૉક્ટરનું Registration Reject કરવું છે?"))return;

 try{

  const batch=writeBatch(db);

  batch.update(doc(db,"doctorProfiles",doctor.id),{
   status:"rejected",
   isOpen:false
  });

  if(publicDoctors[doctor.id]){
   batch.update(doc(db,"publicDoctors",doctor.id),{
    adminActive:false,
    isOpen:false
   });
  }

  await batch.commit();

  await loadDoctors();

  showMessage("ડૉક્ટરનું Registration Reject થયું.");

 }catch(error){
  console.error(error);
  showMessage("Reject Error: "+error.code+" — "+error.message,"error");
 }
}

async function toggleDoctor(doctor,currentStatus){

 const next=!currentStatus;

 if(!confirm(next
  ?"આ ડૉક્ટરને Admin ON કરવો છે?"
  :"આ ડૉક્ટરને Admin OFF કરવો છે?"))return;

 try{

  const batch=writeBatch(db);

  batch.update(doc(db,"publicDoctors",doctor.id),{
   adminActive:next,
   isOpen:false
  });

  if(!next){
   batch.update(doc(db,"doctorProfiles",doctor.id),{
    isOpen:false
   });
  }

  await batch.commit();

  await loadDoctors();

  showMessage(next
   ?"Admin ON થયો. હવે Doctor પોતાની Clinic OPEN કરી શકશે."
   :"Admin OFF થયો. Clinic પણ CLOSED કરવામાં આવી.");

 }catch(error){
  console.error(error);
  showMessage("સ્થિતિ બદલવાની Error: "+error.code+" — "+error.message,"error");
 }
}

function stopDashboard(){

 if(unsubscribeProfiles){
  unsubscribeProfiles();
  unsubscribeProfiles=null;
 }

 if(unsubscribePublic){
  unsubscribePublic();
  unsubscribePublic=null;
 }

}

function startDashboard(user){

 stopDashboard();

 profileDoctors=[];
 publicDoctors={};

 loginSection.classList.add("hidden");
 dashboard.classList.remove("hidden");

 document.getElementById("adminInfo").textContent=
  "Admin UID: "+user.uid;

 doctorList.innerHTML='<p class="hint">ડૉક્ટરોની માહિતી લોડ થઈ રહી છે...</p>';

 unsubscribeProfiles=onSnapshot(
  collection(db,"doctorProfiles"),
  (snapshot)=>{

   profileDoctors=snapshot.docs.map(item=>({
    id:item.id,
    ...item.data()
   }));

   renderDoctors();

  },
  (error)=>{
   console.error(error);
   showMessage("Doctor માહિતી Error: "+error.code+" — "+error.message,"error");
  }
 );

 unsubscribePublic=onSnapshot(
  collection(db,"publicDoctors"),
  (snapshot)=>{

   publicDoctors={};

   snapshot.docs.forEach(item=>{
    publicDoctors[item.id]=item.data();
   });

   renderDoctors();

  },
  (error)=>{
   console.error(error);
   showMessage("Public Doctor Error: "+error.code+" — "+error.message,"error");
  }
 );
}

loginBtn.addEventListener("click",async()=>{

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  showLoginMessage("Email અને Password લખો.");
  return;
 }

 loginBtn.disabled=true;
 loginBtn.textContent="Login થઈ રહ્યું છે...";

 try{

  const result=await signInWithEmailAndPassword(auth,email,password);

  if(result.user.uid!==ADMIN_UID){
   await signOut(auth);
   showLoginMessage("આ એકાઉન્ટ Admin નથી. UID: "+result.user.uid);
  }

 }catch(error){

  console.error("Admin Login Error:",error);

  showLoginMessage(
   "Login Error: "+error.code+" — "+error.message,
   "error"
  );

 }finally{

  loginBtn.disabled=false;
  loginBtn.textContent="Login કરો";

 }
});

onAuthStateChanged(auth,(user)=>{

 if(!user){

  stopDashboard();

  dashboard.classList.add("hidden");
  loginSection.classList.remove("hidden");

  return;
 }

 if(user.uid!==ADMIN_UID){

  showLoginMessage("આ એકાઉન્ટ Admin નથી. UID: "+user.uid);
  signOut(auth);

  return;
 }

 startDashboard(user);
});

document.getElementById("logoutBtn").addEventListener("click",()=>{
 signOut(auth);
});

document.getElementById("refreshBtn").addEventListener("click",async()=>{

 const btn=document.getElementById("refreshBtn");

 if(auth.currentUser?.uid!==ADMIN_UID)return;

 btn.disabled=true;
 btn.textContent="Refresh થઈ રહ્યું છે...";

 try{

  await loadDoctors();
  showMessage("Firebase માંથી નવી માહિતી મળી ગઈ.");

 }catch(error){

  console.error(error);
  showMessage("Refresh Error: "+error.code+" — "+error.message,"error");

 }finally{

  btn.disabled=false;
  btn.textContent="માહિતી Refresh કરો";

 }
});

</script>
</body>
</html>

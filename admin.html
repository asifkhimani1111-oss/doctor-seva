
<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087443">
  <title>DOCTOR SEVA - Admin</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:16px;background:#f2f5f3;font-family:Arial,sans-serif;color:#183329}
    .wrap{max-width:850px;margin:auto}
    header{background:#087443;color:white;padding:20px;border-radius:14px;margin-bottom:16px}
    h1{margin:0 0 6px;font-size:25px}
    h2{font-size:19px}
    .card{background:white;padding:17px;border-radius:13px;margin-bottom:14px;box-shadow:0 2px 8px #0000000d}
    input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ccd8d1;border-radius:8px;font-size:16px}
    button{border:0;padding:12px 16px;border-radius:8px;background:#087443;color:white;font-size:15px;font-weight:bold;margin:5px 5px 5px 0}
    button:disabled{opacity:.5}
    .secondary{background:#52645a}
    .activate{background:#087443}
    .doctor{border:1px solid #dce6df;padding:14px;border-radius:10px;margin:12px 0}
    .muted{color:#64756c;font-size:14px;line-height:1.6}
    .status{font-weight:bold;color:#087443}
    .danger{color:#b3261e}
    #message{padding:10px;border-radius:8px;margin:10px 0;white-space:pre-wrap}
    .hidden{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DOCTOR SEVA</h1>
    <div>Admin Dashboard</div>
  </header>

  <section id="loginBox" class="card">
    <h2>Admin Login</h2>
    <label>Admin Gmail</label>
    <input id="email" type="email" placeholder="Admin Gmail નાખો">
    <label>Password</label>
    <input id="password" type="password" placeholder="Password નાખો">
    <button id="loginBtn">Login</button>
  </section>

  <div id="message" class="hidden"></div>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>Admin Dashboard</h2>
      <div class="muted">Admin: asifkhimani502@gmail.com</div>
      <button id="refreshBtn">ડૉક્ટરોની યાદી Refresh કરો</button>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>

    <div class="card">
      <h2>ડૉક્ટરોની યાદી</h2>
      <div class="muted">નવા ડૉક્ટરને પહેલાં Approve કરો. ત્યારબાદ 30 દિવસ માટે Activate કરો.</div>
      <div id="doctorList">લોડ થઈ રહ્યું છે...</div>
    </div>
  </section>
</div>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  collection,
  doc,
  getDocs,
  updateDoc,
  setDoc,
  Timestamp,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const ADMIN_UID = "T6HtvOLrm5VYXHUuzuU5FZRZxGf2";

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const doctorList = document.getElementById("doctorList");

let doctorsCache = [];

function showMessage(text, error = false) {
  message.textContent = text;
  message.classList.remove("hidden");
  message.style.background = error ? "#fdebea" : "#e5f4e9";
  message.style.color = error ? "#a32119" : "#155b35";
}

function hideMessage() {
  message.classList.add("hidden");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function getExpiryDate(value) {
  if (!value) return null;
  if (typeof value.toDate === "function") return value.toDate();
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function isActive(publicData) {
  const expiry = getExpiryDate(publicData?.expiresAt);
  return publicData?.adminActive === true &&
    expiry !== null &&
    expiry.getTime() > Date.now();
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
    return;
  }

  if (user.uid !== ADMIN_UID) {
    await signOut(auth);
    showMessage("આ Gmailને Admin પરવાનગી નથી.", true);
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
    return;
  }

  hideMessage();
  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
  await loadDoctors();
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Gmail અને Password બંને નાખો.", true);
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    showMessage("Login થઈ શક્યું નથી: " + error.message, true);
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

document.getElementById("refreshBtn").addEventListener("click", loadDoctors);

async function loadDoctors() {
  doctorList.textContent = "લોડ થઈ રહ્યું છે...";
  hideMessage();

  try {
    const snapshot = await getDocs(collection(db, "doctorProfiles"));
    const publicSnapshot = await getDocs(collection(db, "publicDoctors"));

    const publicMap = {};
    publicSnapshot.forEach(item => {
      publicMap[item.id] = item.data();
    });

    doctorsCache = snapshot.docs.map(item => ({
      uid: item.id,
      profile: item.data(),
      publicData: publicMap[item.id] || null
    }));

    if (doctorsCache.length === 0) {
      doctorList.textContent = "હજુ કોઈ ડૉક્ટરનું રજીસ્ટ્રેશન નથી.";
      return;
    }

    doctorList.innerHTML = doctorsCache.map((doctor, index) => {
      const p = doctor.profile;
      const publicData = doctor.publicData;
      const approved = p.status === "approved";
      const active = isActive(publicData);
      const expiry = getExpiryDate(publicData?.expiresAt);

      let statusText = "Pending Approval";
      if (approved) statusText = "Approved";
      if (active) statusText = "Admin Status: ON";
      if (approved && publicData?.adminActive === true && !active) {
        statusText = "30 દિવસ પૂરા - Expired";
      }

      let actionButtons = "";

      if (!approved) {
        actionButtons = `
          <button data-action="approve" data-index="${index}">
            Approve કરો
          </button>`;
      } else {
        actionButtons = `
          <button class="activate" data-action="activate" data-index="${index}">
            ${active ? "30 દિવસ ફરી Activate કરો" : "30 દિવસ Activate કરો"}
          </button>`;
      }

      return `
        <div class="doctor">
          <h3>${escapeHTML((p.name || "") + " " + (p.surname || ""))}</h3>
          <div class="muted">
            Gmail: ${escapeHTML(p.email || "માહિતી નથી")}<br>
            ક્લિનિક: ${escapeHTML(p.clinicName || "માહિતી નથી")}<br>
            ગામ/વિસ્તાર: ${escapeHTML(p.area || "માહિતી નથી")}<br>
            મોબાઇલ: ${escapeHTML(p.phone || "માહિતી નથી")}<br>
            UID: ${escapeHTML(doctor.uid)}
          </div>
          <p class="status">${escapeHTML(statusText)}</p>
          ${expiry ? `<div class="muted">Expiry: ${escapeHTML(expiry.toLocaleString("en-IN"))}</div>` : ""}
          ${actionButtons}
        </div>`;
    }).join("");

  } catch (error) {
    doctorList.textContent = "ડૉક્ટરોની યાદી લોડ થઈ શકી નથી.";
    showMessage("Error: " + error.message, true);
  }
}

doctorList.addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const index = Number(button.dataset.index);
  const doctor = doctorsCache[index];

  if (!doctor) return;

  const uid = doctor.uid;
  const profile = doctor.profile;
  const action = button.dataset.action;

  button.disabled = true;
  hideMessage();

  try {
    if (action === "approve") {
      if (profile.status === "approved") {
        showMessage("આ ડૉક્ટર પહેલેથી Approved છે.");
        return;
      }

      await updateDoc(doc(db, "doctorProfiles", uid), {
        status: "approved"
      });

      await setDoc(doc(db, "publicDoctors", uid), {
        doctorUid: uid,
        name: profile.name || "",
        surname: profile.surname || "",
        clinicName: profile.clinicName || "",
        area: profile.area || "",
        phone: profile.phone || "",
        instructions: profile.instructions || "",
        adminActive: false,
        isOpen: false,
        expiresAt: null
      }, { merge: true });

      showMessage("ડૉક્ટર Approved થઈ ગયા. હવે Activate કરી શકો છો.");
    }

    if (action === "activate") {
      if (profile.status !== "approved") {
        showMessage("પહેલાં ડૉક્ટરને Approve કરો.", true);
        return;
      }

      const expiryDate = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);

      await setDoc(doc(db, "publicDoctors", uid), {
        doctorUid: uid,
        name: profile.name || "",
        surname: profile.surname || "",
        clinicName: profile.clinicName || "",
        area: profile.area || "",
        phone: profile.phone || "",
        instructions: profile.instructions || "",
        adminActive: true,
        isOpen: true,
        activatedAt: serverTimestamp(),
        expiresAt: Timestamp.fromDate(expiryDate)
      }, { merge: true });

      showMessage("ડૉક્ટર 30 દિવસ માટે Activate થયા.");
    }

    await loadDoctors();

  } catch (error) {
    showMessage("કામ પૂર્ણ થયું નથી: " + error.message, true);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>

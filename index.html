
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087b54">
<title>DOCTOR SEVA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f7f5;
 color:#17352c;
}
header{
 background:#087b54;
 color:white;
 padding:22px 16px;
 text-align:center;
}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0}
.container{max-width:850px;margin:auto;padding:15px}
.search{
 width:100%;padding:14px;border:1px solid #ddd;
 border-radius:12px;font-size:16px;margin-bottom:15px;
}
.section-title{font-size:20px;margin:15px 0}
.card{
 background:white;border-radius:16px;
 overflow:hidden;margin-bottom:17px;
 box-shadow:0 3px 12px #00000010;
}
.clinic-photo{
 width:100%;height:205px;object-fit:cover;
 background:#e5eee9;
}
.card-content{padding:15px}
.card h2{margin:0 0 8px;color:#087b54}
.info{margin:8px 0;color:#475b52;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.btn{
 display:inline-block;border:0;border-radius:9px;
 padding:11px 15px;text-decoration:none;
 font-size:14px;font-weight:bold;cursor:pointer;
 background:#087b54;color:white;
}
.whatsapp{background:#168b48}
.form-box{
 background:white;border-radius:15px;
 padding:17px;margin-top:20px;
}
input,textarea,select{
 width:100%;padding:13px;margin:7px 0 13px;
 border:1px solid #ccd9d2;border-radius:9px;
 font-size:15px;background:white;
}
label{font-weight:bold;font-size:14px}
.submit{
 width:100%;padding:14px;background:#087b54;
 color:white;border:0;border-radius:10px;
 font-size:16px;font-weight:bold;
}
.status{text-align:center;padding:20px;color:#64766d}
.notice{
 background:#e5f5ed;padding:12px;
 border-radius:10px;margin:12px 0;
}
footer{text-align:center;padding:22px;color:#65756c}
</style>
</head>

<body>

<header>
<h1>🩺 DOCTOR SEVA</h1>
<p>તમારી નજીકના ડૉક્ટર શોધો</p>
</header>

<main class="container">

<h2 class="section-title">🏥 ચાલુ ક્લિનિક</h2>

<input
 id="search"
 class="search"
 placeholder="ડૉક્ટર અથવા ગામનું નામ શોધો..."
>

<div id="clinicList" class="status">
ક્લિનિક લોડ થઈ રહ્યા છે...
</div>

<section class="form-box" id="patientSection">
<h2>📋 દર્દી રજીસ્ટ્રેશન</h2>

<div class="notice">
પહેલાં ઉપરથી તમારો ડૉક્ટર પસંદ કરો.
</div>

<form id="patientForm">

<label>ડૉક્ટર પસંદ કરો</label>
<select id="doctorSelect" required>
<option value="">ડૉક્ટર પસંદ કરો</option>
</select>

<label>દર્દીનું નામ</label>
<input id="patientName" maxlength="60" required>

<label>અટક</label>
<input id="patientSurname" maxlength="60" required>

<label>ઉંમર</label>
<input id="patientAge" type="number"
min="0" max="120" required>

<label>મોબાઇલ નંબર</label>
<input id="patientMobile" type="tel"
inputmode="numeric" maxlength="10"
pattern="[0-9]{10}" required>

<label>ગામનું નામ</label>
<input id="patientVillage" maxlength="100" required>

<label>દર્દીનો ફોટો (વૈકલ્પિક)</label>
<input id="patientPhoto" type="file"
accept="image/*">

<button class="submit" type="submit">
દર્દીનું રજીસ્ટ્રેશન કરો
</button>

</form>

<p id="formMessage"></p>
</section>

</main>

<footer>
DOCTOR SEVA<br>
તમારા સ્વાસ્થ્યની કાળજી
</footer>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 query,
 where,
 orderBy,
 getDocs,
 addDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const clinicList=document.getElementById("clinicList");
const doctorSelect=document.getElementById("doctorSelect");
const search=document.getElementById("search");
const form=document.getElementById("patientForm");
const message=document.getElementById("formMessage");

let doctors=[];

function safe(value){
 return String(value || "").replace(/[&<>"']/g,
 c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function photo(value){
 if(typeof value==="string" &&
   value.startsWith("data:image/")){
   return value;
 }
 return "";
}

async function loadDoctors(){

 try{

  if(!auth.currentUser){
   await signInAnonymously(auth);
  }

  const now=new Date();

  const q=query(
   collection(db,"publicDoctors"),
   where("adminActive","==",true),
   where("isOpen","==",true),
   where("expiresAt",">",now),
   orderBy("expiresAt")
  );

  const snap=await getDocs(q);

  doctors=snap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  doctorSelect.innerHTML=
   '<option value="">ડૉક્ટર પસંદ કરો</option>';

  doctors.forEach(d=>{
   const option=document.createElement("option");
   option.value=d.id;
   option.textContent=
    (d.name||"")+" "+(d.surname||"")+" - "+(d.clinicName||"ક્લિનિક");
   doctorSelect.appendChild(option);
  });

  showDoctors(doctors);

  if(doctors.length===0){
   clinicList.innerHTML=
    "હાલમાં કોઈ ચાલુ ક્લિનિક ઉપલબ્ધ નથી.";
  }

 }catch(error){

  console.error(error);

  clinicList.innerHTML=
   "ક્લિનિક લોડ થઈ શક્યા નથી. Firebase Rules અને Index તપાસો.";

 }

}

function showDoctors(list){

 if(!list.length){
  clinicList.innerHTML="કોઈ ક્લિનિક મળ્યું નથી.";
  return;
 }

 clinicList.innerHTML="";

 list.forEach(d=>{

  const card=document.createElement("div");
  card.className="card";

  const clinicPhoto=photo(d.doctorPhoto);

  const phone=String(d.phone||"").replace(/\D/g,"");
  const whatsapp=String(d.whatsapp||d.phone||"").replace(/\D/g,"");

  card.innerHTML=`

   ${clinicPhoto?
    `<img class="clinic-photo" src="${clinicPhoto}" alt="Clinic Photo">`:
    `<div class="clinic-photo"></div>`}

   <div class="card-content">

    <h2>Dr. ${safe(d.name)} ${safe(d.surname)}</h2>

    <div class="info">
     🏥 ${safe(d.clinicName)}
    </div>

    <div class="info">
     🎓 ${safe(d.degree||"")}
    </div>

    <div class="info">
     📍 ${safe(d.address||d.area)}
    </div>

    <div class="info">
     📞 ${safe(d.phone)}
    </div>

    <div class="info">
     📢 ${safe(d.instructions)}
    </div>

    <div class="actions">

     ${phone.length===10?
      `<a class="btn" href="tel:${phone}">Call કરો</a>`:""}

     ${whatsapp.length>=10?
      `<a class="btn whatsapp"
       target="_blank"
       rel="noopener"
       href="https://wa.me/${whatsapp}">
       WhatsApp
      </a>`:""}

     <button class="btn"
      data-doctor="${safe(d.id)}">
      આ ડૉક્ટર પસંદ કરો
     </button>

    </div>
   </div>
  `;

  card.querySelector("button").addEventListener("click",()=>{
   doctorSelect.value=d.id;
   document.getElementById("patientSection")
    .scrollIntoView({behavior:"smooth"});
  });

  clinicList.appendChild(card);

 });

}

search.addEventListener("input",()=>{

 const word=search.value.toLowerCase();

 const filtered=doctors.filter(d=>
  [
   d.name,d.surname,d.clinicName,d.area,d.address
  ].some(v=>String(v||"").toLowerCase().includes(word))
 );

 showDoctors(filtered);

});

async function compressPhoto(file){

 if(!file) return "";

 if(!file.type.startsWith("image/")){
  throw new Error("ફક્ત ફોટો પસંદ કરો.");
 }

 if(file.size>5*1024*1024){
  throw new Error("ફોટો 5 MB કરતાં નાનો પસંદ કરો.");
 }

 const data=await new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(new Error("ફોટો વાંચી શકાયો નથી."));
  reader.readAsDataURL(file);

 });

 const img=await new Promise((resolve,reject)=>{

  const image=new Image();

  image.onload=()=>resolve(image);
  image.onerror=()=>reject(new Error("ફોટો ખોલી શકાયો નથી."));
  image.src=data;

 });

 const canvas=document.createElement("canvas");

 const scale=Math.min(1,600/Math.max(img.width,img.height));

 canvas.width=Math.round(img.width*scale);
 canvas.height=Math.round(img.height*scale);

 const ctx=canvas.getContext("2d");
 ctx.drawImage(img,0,0,canvas.width,canvas.height);

 let quality=0.65;
 let output=canvas.toDataURL("image/jpeg",quality);

 while(output.length>250000 && quality>0.25){
  quality-=0.1;
  output=canvas.toDataURL("image/jpeg",quality);
 }

 if(output.length>290000){
  throw new Error("ફોટો વધુ મોટો છે. બીજો ફોટો પસંદ કરો.");
 }

 return output;

}

form.addEventListener("submit",async(e)=>{

 e.preventDefault();

 message.textContent="રજીસ્ટ્રેશન થઈ રહ્યું છે...";

 try{

  if(!auth.currentUser){
   await signInAnonymously(auth);
  }

  const doctorUid=doctorSelect.value;

  const doctor=doctors.find(d=>d.id===doctorUid);

  if(!doctor){
   throw new Error("ચાલુ ડૉક્ટર પસંદ કરો.");
  }

  if(!doctor.adminActive ||
     !doctor.isOpen ||
     !doctor.expiresAt ||
     doctor.expiresAt.toDate()<=new Date()){
   throw new Error("આ ક્લિનિક હાલમાં બંધ છે.");
  }

  const name=document.getElementById("patientName").value.trim();
  const surname=document.getElementById("patientSurname").value.trim();
  const age=Number(document.getElementById("patientAge").value);
  const mobile=document.getElementById("patientMobile").value.trim();
  const village=document.getElementById("patientVillage").value.trim();

  if(!/^[0-9]{10}$/.test(mobile)){
   throw new Error("યોગ્ય 10 અંકનો મોબાઇલ નંબર લખો.");
  }

  if(!Number.isInteger(age)||age<0||age>120){
   throw new Error("યોગ્ય ઉંમર લખો.");
  }

  const file=document.getElementById("patientPhoto").files[0];
  const patientPhoto=await compressPhoto(file);

  await addDoc(collection(db,"patientCases"),{

   patientUid:auth.currentUser.uid,
   doctorUid:doctorUid,
   name:name,
   surname:surname,
   age:age,
   village:village,
   mobile:mobile,
   patientPhoto:patientPhoto,
   createdAt:serverTimestamp()

  });

  message.textContent="રજીસ્ટ્રેશન સફળ થયું!";

  form.reset();

 }catch(error){

  console.error(error);
  message.textContent=error.message||"રજીસ્ટ્રેશન થઈ શક્યું નથી.";

 }

});

loadDoctors();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>DOCTOR SEVA</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#18352a}
header{background:#087443;color:white;padding:25px 15px;text-align:center}
header h1{margin:0;font-size:29px}
header p{margin:8px 0 0;font-size:14px}
main{max-width:650px;margin:20px auto;padding:0 14px}
.card{background:white;border-radius:15px;padding:19px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
h2{color:#087443;font-size:20px;margin:0 0 16px}
.doctor{border:1px solid #dce9e1;border-radius:12px;padding:14px;margin-bottom:12px}
.doctor h3{color:#087443;margin:0 0 9px}
.doctor p{margin:7px 0;font-size:14px;overflow-wrap:anywhere;line-height:1.5}
.photo{width:105px;height:105px;border-radius:50%;object-fit:cover;border:2px solid #dce9e1;margin:4px 0 12px}
.status{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;background:#e2f5e9;color:#087443}
label{display:block;font-weight:bold;margin:15px 0 7px;font-size:14px}
input,select{width:100%;padding:13px;border:1px solid #ccd9d1;border-radius:9px;font-size:16px;background:white;color:#18352a}
input:focus,select:focus{outline:2px solid #087443;border-color:#087443}
button{width:100%;border:0;border-radius:10px;background:#087443;color:white;padding:15px;margin-top:20px;font-size:17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.hint{color:#66766d;font-size:12px;margin-top:7px;line-height:1.5}
#message{display:none;margin-top:14px;padding:12px;border-radius:9px;font-size:14px;line-height:1.5}
.success{display:block!important;background:#e2f5e9;color:#087443}
.error{display:block!important;background:#ffeded;color:#b3261e}
.empty{text-align:center;padding:15px 5px;color:#66766d;font-size:14px}
footer{text-align:center;padding:20px;color:#718078;font-size:12px}
</style>
</head>

<body>

<header>
<h1>DOCTOR SEVA</h1>
<p>ડૉક્ટર અને દર્દી સેવા</p>
</header>

<main>

<section class="card">
<h2>અમારા ડૉક્ટરો</h2>
<div id="doctorList">
<div class="empty">ડૉક્ટરોની માહિતી લોડ થઈ રહી છે...</div>
</div>
</section>

<section class="card">
<h2>દર્દી નોંધણી ફોર્મ</h2>

<form id="patientForm">

<label for="doctor">ડૉક્ટર પસંદ કરો *</label>
<select id="doctor" required>
<option value="">ડૉક્ટર પસંદ કરો</option>
</select>

<label for="patientName">નામ *</label>
<input type="text" id="patientName" maxlength="60"
placeholder="દર્દીનું નામ" autocomplete="given-name" required>

<label for="surname">અટક *</label>
<input type="text" id="surname" maxlength="60"
placeholder="દર્દીની અટક" autocomplete="family-name" required>

<label for="age">ઉંમર *</label>
<input type="number" id="age" min="1" max="120" step="1"
placeholder="ઉંમર વર્ષમાં" required>

<label for="village">ગામ *</label>
<input type="text" id="village" maxlength="80"
placeholder="તમારું ગામ" required>

<label for="patientPhone">મોબાઇલ નંબર *</label>
<input type="tel" id="patientPhone" maxlength="10"
minlength="10" inputmode="numeric" pattern="[0-9]{10}"
placeholder="10 અંકનો મોબાઇલ નંબર" autocomplete="tel" required>

<div class="hint">
તમારી માહિતી પસંદ કરેલા ડૉક્ટર અને અધિકૃત Admin માટે નોંધવામાં આવશે.
</div>

<button type="submit" id="submitBtn">નોંધણી મોકલો</button>
<div id="message" role="status" aria-live="polite"></div>

</form>
</section>

</main>

<footer>
© DOCTOR SEVA
<p>આ એપ તબીબી ઇમરજન્સી સેવા નથી.</p>
</footer>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInAnonymously,
 signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 query,
 where,
 onSnapshot,
 addDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const doctorList=document.getElementById("doctorList");
const doctorSelect=document.getElementById("doctor");
const patientForm=document.getElementById("patientForm");
const submitBtn=document.getElementById("submitBtn");
const message=document.getElementById("message");

let doctors=[];

function showMessage(text,type){
 message.textContent=text;
 message.className=type;
}

function makeElement(tag,text,className){
 const el=document.createElement(tag);
 el.textContent=text;
 if(className)el.className=className;
 return el;
}

function renderDoctors(){
 doctorList.replaceChildren();

 const previousSelection=doctorSelect.value;

 doctorSelect.replaceChildren();

 const defaultOption=document.createElement("option");
 defaultOption.value="";
 defaultOption.textContent="ડૉક્ટર પસંદ કરો";
 doctorSelect.appendChild(defaultOption);

 if(doctors.length===0){
  doctorList.appendChild(
   makeElement("div","હાલમાં કોઈ ડૉક્ટર ઉપલબ્ધ નથી.","empty")
  );
  return;
 }

 doctors.forEach((doctor)=>{
  const card=document.createElement("div");
  card.className="doctor";

  if(doctor.photoBase64){
   const photo=document.createElement("img");
   photo.className="photo";
   photo.src=doctor.photoBase64;
   photo.alt="ડૉક્ટરનો ફોટો";
   card.appendChild(photo);
  }

  const fullName=
   ((doctor.name||"")+" "+(doctor.surname||"")).trim();

  card.appendChild(
   makeElement("h3",fullName||"ડૉક્ટર")
  );

  card.appendChild(
   makeElement("p","ક્લિનિક: "+(doctor.clinicName||"માહિતી ઉપલબ્ધ નથી"))
  );

  card.appendChild(
   makeElement("p","ગામ / વિસ્તાર: "+(doctor.area||"માહિતી ઉપલબ્ધ નથી"))
  );

  card.appendChild(
   makeElement("p","મોબાઇલ: "+(doctor.phone||"માહિતી ઉપલબ્ધ નથી"))
  );

  card.appendChild(
   makeElement("span","ક્લિનિક ચાલુ છે","status")
  );

  card.appendChild(
   makeElement(
    "p",
    "સૂચનાઓ: "+(doctor.instructions||"કોઈ સૂચના નથી")
   )
  );

  doctorList.appendChild(card);

  const option=document.createElement("option");
  option.value=doctor.id;
  option.textContent=
   (fullName||"ડૉક્ટર")+" - "+(doctor.clinicName||"ક્લિનિક");

  doctorSelect.appendChild(option);
 });

 if(doctors.some(d=>d.id===previousSelection)){
  doctorSelect.value=previousSelection;
 }
}

const doctorsQuery=query(
 collection(db,"publicDoctors"),
 where("adminActive","==",true),
 where("isOpen","==",true)
);

onSnapshot(
 doctorsQuery,
 (snapshot)=>{
  doctors=snapshot.docs.map(item=>({
   id:item.id,
   ...item.data()
  }));

  renderDoctors();
 },
 (error)=>{
  console.error("Doctor list error:",error);
  doctorList.textContent=
   "ડૉક્ટરોની માહિતી લોડ થઈ શકતી નથી. સુરક્ષા નિયમો તપાસો.";
 }
);

patientForm.addEventListener("submit",async(event)=>{
 event.preventDefault();
 message.className="";

 const doctorId=doctorSelect.value;

 const selectedDoctor=doctors.find(
  doctor=>doctor.id===doctorId
 );

 if(!selectedDoctor||
    selectedDoctor.adminActive!==true||
    selectedDoctor.isOpen!==true){
  showMessage("પસંદ કરેલો ડૉક્ટર હાલમાં ઉપલબ્ધ નથી. ફરી પસંદ કરો.","error");
  return;
 }

 const patientName=
  document.getElementById("patientName").value.trim();

 const surname=
  document.getElementById("surname").value.trim();

 const age=Number(document.getElementById("age").value);

 const village=
  document.getElementById("village").value.trim();

 const patientPhone=
  document.getElementById("patientPhone").value.trim();

 if(!Number.isInteger(age)||age<1||age>120){
  showMessage("કૃપા કરીને યોગ્ય ઉંમર લખો.","error");
  return;
 }

 if(!/^[0-9]{10}$/.test(patientPhone)){
  showMessage("10 અંકનો યોગ્ય મોબાઇલ નંબર લખો.","error");
  return;
 }

 submitBtn.disabled=true;
 submitBtn.textContent="માહિતી મોકલાઈ રહી છે...";

 try{
  let user=auth.currentUser;

  if(user&&user.isAnonymous!==true){
   await signOut(auth);
   user=null;
  }

  if(!user){
   const result=await signInAnonymously(auth);
   user=result.user;
  }

  await addDoc(collection(db,"patientCases"),{
   patientUid:user.uid,
   doctorUid:doctorId,
   patientName:patientName,
   surname:surname,
   age:age,
   village:village,
   patientPhone:patientPhone,
   status:"new",
   createdAt:serverTimestamp()
  });

  showMessage("તમારી નોંધણી સફળતાપૂર્વક મોકલાઈ છે.","success");
  patientForm.reset();

 }catch(error){
  console.error("Patient submission error:",error);

  if(error.code==="permission-denied"){
   showMessage(
    "નોંધણી મોકલી શકાઈ નથી. ડૉક્ટરની સ્થિતિ અથવા Firestore Rules તપાસો.",
    "error"
   );
  }else{
   showMessage(
    "માહિતી મોકલી શકાઈ નથી. ઇન્ટરનેટ તપાસો અને ફરી પ્રયાસ કરો.",
    "error"
   );
  }

 }finally{
  submitBtn.disabled=false;
  submitBtn.textContent="નોંધણી મોકલો";
 }

});

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087b54">
<title>DOCTOR SEVA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f7f5;
 color:#17352c;
}
header{
 background:#087b54;
 color:white;
 padding:22px 16px;
 text-align:center;
}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0}
.container{max-width:850px;margin:auto;padding:15px}
.search{
 width:100%;padding:14px;border:1px solid #ddd;
 border-radius:12px;font-size:16px;margin-bottom:15px;
}
.section-title{font-size:20px;margin:15px 0}
.card{
 background:white;border-radius:16px;
 overflow:hidden;margin-bottom:17px;
 box-shadow:0 3px 12px #00000010;
}
.clinic-photo{
 width:100%;height:205px;object-fit:cover;
 background:#e5eee9;
}
.card-content{padding:15px}
.card h2{margin:0 0 8px;color:#087b54}
.info{margin:8px 0;color:#475b52;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.btn{
 display:inline-block;border:0;border-radius:9px;
 padding:11px 15px;text-decoration:none;
 font-size:14px;font-weight:bold;cursor:pointer;
 background:#087b54;color:white;
}
.whatsapp{background:#168b48}
.form-box{
 background:white;border-radius:15px;
 padding:17px;margin-top:20px;
}
input,textarea,select{
 width:100%;padding:13px;margin:7px 0 13px;
 border:1px solid #ccd9d2;border-radius:9px;
 font-size:15px;background:white;
}
label{font-weight:bold;font-size:14px}
.submit{
 width:100%;padding:14px;background:#087b54;
 color:white;border:0;border-radius:10px;
 font-size:16px;font-weight:bold;
}
.submit:disabled{opacity:.6;cursor:not-allowed}
.status{text-align:center;padding:20px;color:#64766d}
.notice{
 background:#e5f5ed;padding:12px;
 border-radius:10px;margin:12px 0;
}
footer{text-align:center;padding:22px;color:#65756c}
#formMessage{line-height:1.6;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🩺 DOCTOR SEVA</h1>
<p>તમારી નજીકના ડૉક્ટર શોધો</p>
</header>

<main class="container">

<h2 class="section-title">🏥 ચાલુ ક્લિનિક</h2>

<input
 id="search"
 class="search"
 placeholder="ડૉક્ટર અથવા ગામનું નામ શોધો..."
>

<div id="clinicList" class="status">
ક્લિનિક લોડ થઈ રહ્યા છે...
</div>

<section class="form-box" id="patientSection">
<h2>📋 દર્દી રજીસ્ટ્રેશન</h2>

<div class="notice">
પહેલાં ઉપરથી તમારો ડૉક્ટર પસંદ કરો.
</div>

<form id="patientForm">

<label>ડૉક્ટર પસંદ કરો</label>
<select id="doctorSelect" required>
<option value="">ડૉક્ટર પસંદ કરો</option>
</select>

<label>દર્દીનું નામ</label>
<input id="patientName" maxlength="60" required>

<label>અટક</label>
<input id="patientSurname" maxlength="60" required>

<label>ઉંમર</label>
<input id="patientAge" type="number"
min="0" max="120" required>

<label>મોબાઇલ નંબર</label>
<input id="patientMobile" type="tel"
inputmode="numeric" maxlength="10"
pattern="[0-9]{10}" required>

<label>ગામનું નામ</label>
<input id="patientVillage" maxlength="100" required>

<label>દર્દીનો ફોટો (વૈકલ્પિક)</label>
<input id="patientPhoto" type="file"
accept="image/*">

<button class="submit" id="submitButton" type="submit">
દર્દીનું રજીસ્ટ્રેશન કરો
</button>

</form>

<p id="formMessage" role="status"></p>
</section>

</main>

<footer>
DOCTOR SEVA<br>
તમારા સ્વાસ્થ્યની કાળજી
</footer>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 query,
 where,
 getDocs,
 doc,
 runTransaction,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const clinicList=document.getElementById("clinicList");
const doctorSelect=document.getElementById("doctorSelect");
const search=document.getElementById("search");
const form=document.getElementById("patientForm");
const message=document.getElementById("formMessage");
const submitButton=document.getElementById("submitButton");

let doctors=[];
let submitting=false;

function safe(value){
 return String(value || "").replace(/[&<>"']/g,
 c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function photo(value){
 if(typeof value==="string" &&
   value.startsWith("data:image/")){
   return value;
 }
 return "";
}

function isClinicActive(d){
 return d.adminActive===true
  && d.isOpen===true
  && d.expiresAt
  && typeof d.expiresAt.toDate==="function"
  && d.expiresAt.toDate()>new Date();
}

// Patient booking requires anonymous authentication.
async function ensureAnonymousAuth(){

 if(auth.currentUser){

  if(auth.currentUser.isAnonymous){
   return auth.currentUser;
  }

  throw new Error(
   "આ બ્રાઉઝરમાં ડૉક્ટરનું લોગિન ચાલુ છે. પેશન્ટ બુકિંગ માટે અલગ અનામિક સેશન જરૂરી છે."
  );

 }

 const result=await signInAnonymously(auth);

 return result.user;
}

async function loadDoctors(){

 try{

  await ensureAnonymousAuth();

  const q=query(
   collection(db,"publicDoctors"),
   where("adminActive","==",true),
   where("isOpen","==",true)
  );

  const snap=await getDocs(q);

  const allDoctors=snap.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  doctors=allDoctors.filter(isClinicActive);

  doctorSelect.innerHTML=
   '<option value="">ડૉક્ટર પસંદ કરો</option>';

  doctors.forEach(d=>{
   const option=document.createElement("option");
   option.value=d.id;
   option.textContent=
    (d.name||"")+" "+(d.surname||"")+" - "+(d.clinicName||"ક્લિનિક");
   doctorSelect.appendChild(option);
  });

  showDoctors(doctors);

  if(doctors.length===0){
   clinicList.innerHTML=
    "હાલમાં કોઈ ચાલુ ક્લિનિક ઉપલબ્ધ નથી.";
  }

 }catch(error){

  console.error("Clinic loading error:",error);

  clinicList.innerHTML=
   "ક્લિનિક લોડ થઈ શક્યા નથી. Firebase Rules અને Index તપાસો.";

 }

}

function showDoctors(list){

 if(!list.length){
  clinicList.innerHTML="કોઈ ક્લિનિક મળ્યું નથી.";
  return;
 }

 clinicList.innerHTML="";

 list.forEach(d=>{

  const card=document.createElement("div");
  card.className="card";

  const clinicPhoto=photo(d.doctorPhoto);

  const phone=String(d.phone||"").replace(/\D/g,"");
  const whatsapp=String(d.whatsapp||d.phone||"").replace(/\D/g,"");

  card.innerHTML=`

   ${clinicPhoto?
    `<img class="clinic-photo" src="${clinicPhoto}" alt="Clinic Photo">`:
    `<div class="clinic-photo"></div>`}

   <div class="card-content">

    <h2>Dr. ${safe(d.name)} ${safe(d.surname)}</h2>

    <div class="info">
     🏥 ${safe(d.clinicName)}
    </div>

    <div class="info">
     🎓 ${safe(d.degree||"")}
    </div>

    <div class="info">
     📍 ${safe(d.address||d.area)}
    </div>

    <div class="info">
     📞 ${safe(d.phone)}
    </div>

    <div class="info">
     📢 ${safe(d.instructions)}
    </div>

    <div class="actions">

     ${phone.length===10?
      `<a class="btn" href="tel:${phone}">Call કરો</a>`:""}

     ${whatsapp.length>=10?
      `<a class="btn whatsapp"
       target="_blank"
       rel="noopener"
       href="https://wa.me/${whatsapp}">
       WhatsApp
      </a>`:""}

     <button class="btn"
      data-doctor="${safe(d.id)}">
      આ ડૉક્ટર પસંદ કરો
     </button>

    </div>
   </div>
  `;

  card.querySelector("button").addEventListener("click",()=>{
   doctorSelect.value=d.id;
   document.getElementById("patientSection")
    .scrollIntoView({behavior:"smooth"});
  });

  clinicList.appendChild(card);

 });

}

search.addEventListener("input",()=>{

 const word=search.value.toLowerCase();

 const filtered=doctors.filter(d=>
  [
   d.name,d.surname,d.clinicName,d.area,d.address
  ].some(v=>String(v||"").toLowerCase().includes(word))
 );

 showDoctors(filtered);

});

async function compressPhoto(file){

 if(!file) return "";

 if(!file.type.startsWith("image/")){
  throw new Error("ફક્ત ફોટો પસંદ કરો.");
 }

 if(file.size>5*1024*1024){
  throw new Error("ફોટો 5 MB કરતાં નાનો પસંદ કરો.");
 }

 const data=await new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(new Error("ફોટો વાંચી શકાયો નથી."));
  reader.readAsDataURL(file);

 });

 const img=await new Promise((resolve,reject)=>{

  const image=new Image();

  image.onload=()=>resolve(image);
  image.onerror=()=>reject(new Error("ફોટો ખોલી શકાયો નથી."));
  image.src=data;

 });

 const canvas=document.createElement("canvas");

 const scale=Math.min(1,600/Math.max(img.width,img.height));

 canvas.width=Math.round(img.width*scale);
 canvas.height=Math.round(img.height*scale);

 const ctx=canvas.getContext("2d");
 ctx.drawImage(img,0,0,canvas.width,canvas.height);

 let quality=0.65;
 let output=canvas.toDataURL("image/jpeg",quality);

 while(output.length>250000 && quality>0.25){
  quality-=0.1;
  output=canvas.toDataURL("image/jpeg",quality);
 }

 if(output.length>290000){
  throw new Error("ફોટો વધુ મોટો છે. બીજો ફોટો પસંદ કરો.");
 }

 return output;

}

// Atomically book one available slot and create patient record.
async function createPatientBooking(data){

 const user=await ensureAnonymousAuth();

 const doctorUid=data.doctorUid;

 const settingsRef=doc(db,"bookingSettings",doctorUid);

 const publicDoctorRef=doc(db,"publicDoctors",doctorUid);

 const caseRef=doc(collection(db,"patientCases"));

 await runTransaction(db,async(transaction)=>{

  // All reads must happen before writes.
  const settingsSnap=await transaction.get(settingsRef);

  if(!settingsSnap.exists()){
   throw new Error("આ ડૉક્ટરે હજુ બુકિંગ લિમિટ સેટ કરી નથી.");
  }

  const settings=settingsSnap.data();

  const limit=settings.limit;
  const generation=settings.generation;

  if(
   !Number.isInteger(limit) ||
   limit<1 ||
   limit>100 ||
   typeof generation!=="string" ||
   !generation
  ){
   throw new Error("ડૉક્ટરની બુકિંગ સેટિંગ યોગ્ય નથી.");
  }

  const publicSnap=await transaction.get(publicDoctorRef);

  if(!publicSnap.exists()){
   throw new Error("ડૉક્ટરની માહિતી ઉપલબ્ધ નથી.");
  }

  const publicData=publicSnap.data();

  if(
   publicData.adminActive!==true ||
   publicData.isOpen!==true ||
   !publicData.expiresAt ||
   typeof publicData.expiresAt.toDate!=="function" ||
   publicData.expiresAt.toDate()<=new Date()
  ){
   throw new Error("આ ક્લિનિક હાલમાં બંધ છે.");
  }

  let availableSlot=null;

  // Read current generation slots until one is available.
  for(let i=1;i<=limit;i++){

   const slotId=`${doctorUid}_${generation}_${i}`;

   const slotRef=doc(db,"bookingSlots",slotId);

   const slotSnap=await transaction.get(slotRef);

   if(!slotSnap.exists()){
    continue;
   }

   const slot=slotSnap.data();

   if(
    slot.doctorUid===doctorUid &&
    slot.generation===generation &&
    slot.slotNumber===i &&
    slot.status==="available"
   ){
    availableSlot={
     id:slotId,
     ref:slotRef
    };

    break;
   }

  }

  if(!availableSlot){
   throw new Error("આ ડૉક્ટરની બુકિંગ લિમિટ પૂરી થઈ ગઈ છે. હવે નવી બુકિંગ ઉપલબ્ધ નથી.");
  }

  // Claim the slot and create patient record in one transaction.
  transaction.update(availableSlot.ref,{

   status:"booked",
   patientUid:user.uid,
   patientCaseId:caseRef.id,
   bookedAt:serverTimestamp()

  });

  transaction.set(caseRef,{

   patientUid:user.uid,
   doctorUid:doctorUid,
   name:data.name,
   surname:data.surname,
   age:data.age,
   village:data.village,
   mobile:data.mobile,
   patientPhoto:data.patientPhoto,
   createdAt:serverTimestamp(),

   bookingSlotId:availableSlot.id,
   bookingGeneration:generation

  });

 });

}

form.addEventListener("submit",async(e)=>{

 e.preventDefault();

 if(submitting) return;

 submitting=true;
 submitButton.disabled=true;
 submitButton.textContent="રજીસ્ટ્રેશન થઈ રહ્યું છે...";
 message.textContent="કૃપા કરીને રાહ જુઓ...";

 try{

  await ensureAnonymousAuth();

  const doctorUid=doctorSelect.value;

  const doctor=doctors.find(d=>d.id===doctorUid);

  if(!doctor){
   throw new Error("ચાલુ ડૉક્ટર પસંદ કરો.");
  }

  if(!isClinicActive(doctor)){
   throw new Error("આ ક્લિનિક હાલમાં બંધ છે. બીજો ડૉક્ટર પસંદ કરો.");
  }

  const name=document.getElementById("patientName").value.trim();
  const surname=document.getElementById("patientSurname").value.trim();
  const age=Number(document.getElementById("patientAge").value);
  const mobile=document.getElementById("patientMobile").value.trim();
  const village=document.getElementById("patientVillage").value.trim();

  if(!name || !surname || !village){
   throw new Error("બધી જરૂરી માહિતી ભરો.");
  }

  if(!/^[0-9]{10}$/.test(mobile)){
   throw new Error("યોગ્ય 10 અંકનો મોબાઇલ નંબર લખો.");
  }

  if(!Number.isInteger(age)||age<0||age>120){
   throw new Error("યોગ્ય ઉંમર લખો.");
  }

  const file=document.getElementById("patientPhoto").files[0];
  const patientPhoto=await compressPhoto(file);

  await createPatientBooking({
   doctorUid,
   name,
   surname,
   age,
   village,
   mobile,
   patientPhoto
  });

  message.textContent="રજીસ્ટ્રેશન સફળ થયું! તમારી બુકિંગ નોંધાઈ ગઈ છે.";

  form.reset();

 }catch(error){

  console.error("Patient registration error:",error);

  message.textContent=error.message||"રજીસ્ટ્રેશન થઈ શક્યું નથી.";

 }finally{

  submitting=false;
  submitButton.disabled=false;
  submitButton.textContent="દર્દીનું રજીસ્ટ્રેશન કરો";

 }

});

loadDoctors();

</script>

</body>
</html>

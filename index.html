
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>DOCTOR SEVA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f7f4;
 color:#18352a;
}
header{
 background:#087443;
 color:white;
 text-align:center;
 padding:22px 15px;
}
header h1{margin:0;font-size:26px}
header p{margin:7px 0 0}
.container{max-width:700px;margin:auto;padding:15px}
.card{
 background:white;
 padding:17px;
 border-radius:14px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #0000000d;
}
h3{color:#087443;margin-top:0}
.doctor{
 border:1px solid #dce9df;
 padding:13px;
 border-radius:12px;
 margin:12px 0;
}
.doctor img{
 width:100%;
 max-height:200px;
 object-fit:contain;
 border-radius:9px;
 background:#f2f7f4;
}
.doctor h4{margin:8px 0;color:#087443}
.doctor p{margin:6px 0;font-size:14px}
input,select,button{
 width:100%;
 padding:13px;
 border-radius:9px;
 font-size:15px;
 margin-top:9px;
}
input,select{border:1px solid #ccd8d0}
button{
 border:0;
 background:#087443;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.6}
.message{
 padding:12px;
 border-radius:9px;
 margin-top:12px;
 font-size:14px;
}
.error{background:#ffe5e5;color:#a00020}
.success{background:#e0f4e8;color:#087443}
.small{font-size:12px;color:#65736b}
label{display:block;margin-top:12px;font-size:14px;font-weight:bold}
footer{text-align:center;padding:20px;color:#758078;font-size:12px}
</style>
</head>

<body>

<header>
 <h1>DOCTOR SEVA</h1>
 <p>ડૉક્ટર અને દર્દી સેવા</p>
</header>

<div class="container">

 <div class="card">
  <h3>અમારા ડૉક્ટરો</h3>
  <div id="doctorList">ડૉક્ટરોની માહિતી લોડ થઈ રહી છે...</div>
 </div>

 <div class="card">
  <h3>દર્દી નોંધણી ફોર્મ</h3>

  <form id="patientForm">

   <label>ડૉક્ટર પસંદ કરો *</label>
   <select id="doctorSelect" required>
    <option value="">ડૉક્ટર પસંદ કરો</option>
   </select>

   <label>નામ *</label>
   <input id="patientName" required maxlength="60">

   <label>અટક *</label>
   <input id="surname" required maxlength="60">

   <label>ઉંમર *</label>
   <input id="age" type="number" min="1" max="120" required>

   <label>ગામ *</label>
   <input id="village" required maxlength="80">

   <label>મોબાઇલ નંબર *</label>
   <input id="patientPhone"
    type="tel"
    inputmode="numeric"
    pattern="[0-9]{10}"
    maxlength="10"
    placeholder="10 આંકડાનો મોબાઇલ નંબર"
    required>

   <label>દર્દીનો ફોટો (વૈકલ્પિક)</label>
   <input id="patientPhoto" type="file" accept="image/*">

   <p class="small">
    ફોટો આપવો ફરજિયાત નથી. ફોટો પસંદ કરેલા ડૉક્ટર અને અધિકૃત Admin જોઈ શકશે.
   </p>

   <p class="small">
    તમારી માહિતી પસંદ કરેલા ડૉક્ટર અને અધિકૃત Admin માટે નોંધવામાં આવશે.
   </p>

   <button id="submitBtn" type="submit">નોંધણી મોકલો</button>

   <div id="formMessage"></div>

  </form>
 </div>

</div>

<footer>
 © DOCTOR SEVA<br>
 આ એપ તબીબી ઇમરજન્સી સેવા નથી.
</footer>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 query,
 where,
 getDocs,
 getDoc,
 doc,
 addDoc,
 Timestamp,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const $=id=>document.getElementById(id);

let doctors={};

function showMessage(text,type="error"){
 const box=$("formMessage");
 box.innerHTML="";
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 box.appendChild(div);
}

async function loadDoctors(){

 const list=$("doctorList");
 const select=$("doctorSelect");

 list.textContent="ડૉક્ટરોની માહિતી લોડ થઈ રહી છે...";

 try{

  const q=query(
   collection(db,"publicDoctors"),
   where("adminActive","==",true),
   where("isOpen","==",true),
   where("expiresAt",">",Timestamp.now())
  );

  const snapshot=await getDocs(q);

  list.innerHTML="";
  select.innerHTML='<option value="">ડૉક્ટર પસંદ કરો</option>';
  doctors={};

  if(snapshot.empty){
   list.textContent="હાલ કોઈ ડૉક્ટરની ક્લિનિક ચાલુ નથી.";
   return;
  }

  snapshot.forEach(item=>{

   const d=item.data();

   if(
    d.adminActive!==true ||
    d.isOpen!==true ||
    !d.expiresAt ||
    d.expiresAt.toMillis()<=Date.now()
   )return;

   doctors[item.id]=d;

   const name=[
    d.name,
    d.surname
   ].filter(Boolean).join(" ")||"ડૉક્ટર";

   const option=document.createElement("option");
   option.value=item.id;
   option.textContent=name+" - "+(d.clinicName||"ક્લિનિક");
   select.appendChild(option);

   const card=document.createElement("div");
   card.className="doctor";

   // FIXED: Correct Firebase photo field
   if(d.doctorPhoto){

    const img=document.createElement("img");

    img.src=d.doctorPhoto;
    img.alt="ડૉક્ટરનો ફોટો";

    img.onerror=()=>{
     img.style.display="none";
    };

    card.appendChild(img);
   }

   const title=document.createElement("h4");
   title.textContent=name;
   card.appendChild(title);

   function line(text){
    const p=document.createElement("p");
    p.textContent=text;
    card.appendChild(p);
   }

   line("ક્લિનિક: "+(d.clinicName||"માહિતી નથી"));
   line("ગામ / વિસ્તાર: "+(d.area||"માહિતી નથી"));
   line("મોબાઇલ: "+(d.phone||"માહિતી નથી"));
   line("ક્લિનિક ચાલુ છે");

   if(d.instructions){
    line("સૂચનાઓ: "+d.instructions);
   }

   list.appendChild(card);

  });

  if(Object.keys(doctors).length===0){
   list.textContent="હાલ કોઈ ડૉક્ટરની ક્લિનિક ચાલુ નથી.";
  }

 }catch(error){

  console.error(error);

  list.textContent=
   "ડૉક્ટરોની માહિતી લોડ થઈ શકતી નથી: "+error.code;
 }
}

// PHOTO COMPRESS
async function compressPhoto(file){

 if(!file)return null;

 if(!file.type.startsWith("image/")){
  throw new Error("કૃપા કરીને યોગ્ય ફોટો પસંદ કરો.");
 }

 const image=new Image();
 const url=URL.createObjectURL(file);

 try{

  await new Promise((resolve,reject)=>{
   image.onload=resolve;
   image.onerror=reject;
   image.src=url;
  });

  const canvas=document.createElement("canvas");

  const scale=Math.min(
   1,
   900/Math.max(image.width,image.height)
  );

  canvas.width=Math.round(image.width*scale);
  canvas.height=Math.round(image.height*scale);

  const ctx=canvas.getContext("2d");

  ctx.drawImage(
   image,0,0,canvas.width,canvas.height
  );

  let quality=0.65;
  let result=canvas.toDataURL("image/jpeg",quality);

  while(result.length>140000 && quality>0.25){
   quality-=0.10;
   result=canvas.toDataURL("image/jpeg",quality);
  }

  if(result.length>150000){
   throw new Error("ફોટો મોટો છે. નાનો ફોટો પસંદ કરો.");
  }

  return result;

 }finally{
  URL.revokeObjectURL(url);
 }
}

// PATIENT REGISTRATION
$("patientForm").addEventListener("submit",async(event)=>{

 event.preventDefault();

 const btn=$("submitBtn");
 btn.disabled=true;
 btn.textContent="મોકલી રહ્યા છીએ...";

 try{

  const doctorUid=$("doctorSelect").value;

  const name=$("patientName").value.trim();
  const surname=$("surname").value.trim();
  const age=Number($("age").value);
  const village=$("village").value.trim();
  const phone=$("patientPhone").value.trim();

  if(!doctors[doctorUid]){
   throw new Error("કૃપા કરીને ચાલુ ક્લિનિક પસંદ કરો.");
  }

  if(!/^[0-9]{10}$/.test(phone)){
   throw new Error("યોગ્ય 10 આંકડાનો મોબાઇલ નંબર લખો.");
  }

  if(!Number.isInteger(age)||age<1||age>120){
   throw new Error("યોગ્ય ઉંમર લખો.");
  }

  const doctorSnap=await getDoc(
   doc(db,"publicDoctors",doctorUid)
  );

  if(!doctorSnap.exists()){
   throw new Error("ડૉક્ટરની માહિતી મળી નથી.");
  }

  const d=doctorSnap.data();

  if(
   d.adminActive!==true ||
   d.isOpen!==true ||
   !d.expiresAt ||
   d.expiresAt.toMillis()<=Date.now()
  ){
   throw new Error("આ ડૉક્ટરની ક્લિનિક હાલમાં બંધ છે.");
  }

  let patientPhoto=null;

  const file=$("patientPhoto").files[0];

  if(file){
   patientPhoto=await compressPhoto(file);
  }

  let user=auth.currentUser;

  if(!user || !user.isAnonymous){
   const result=await signInAnonymously(auth);
   user=result.user;
  }

  const patientData={
   patientUid:user.uid,
   doctorUid:doctorUid,
   patientName:name,
   surname:surname,
   age:age,
   village:village,
   patientPhone:phone,
   status:"new",
   createdAt:serverTimestamp()
  };

  if(patientPhoto){
   patientData.patientPhoto=patientPhoto;
  }

  await addDoc(
   collection(db,"patientCases"),
   patientData
  );

  showMessage(
   "તમારી નોંધણી સફળતાપૂર્વક મોકલાઈ ગઈ છે.",
   "success"
  );

  $("patientForm").reset();

 }catch(error){

  console.error(error);

  showMessage(
   error.message||"નોંધણી મોકલી શકાઈ નથી."
  );

 }finally{

  btn.disabled=false;
  btn.textContent="નોંધણી મોકલો";

 }
});

loadDoctors();

</script>

</body>
</html>
